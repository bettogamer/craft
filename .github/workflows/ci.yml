name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck Craft/ --config .luacheckrc

  taintlint:
    name: Secret values (taintlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Action propio (github.com/marketplace/actions/taintlint): secret values de WoW 12.0+.
      # La db la elige el propio taintlint desde el `## Interface` del .toc (hoy 120100 → 12.1.0).
      # Craft es UI pura (0 hallazgos verificados en local, db 12.1.0) — el job garantiza
      # que siga así. Anota hallazgos inline en el diff del PR y falla con errores nuevos.
      - name: taintlint Craft
        uses: bettogamer/taintlint@v0
        with:
          path: Craft

      - name: taintlint Craft_Browser
        uses: bettogamer/taintlint@v0
        with:
          path: Craft_Browser

  test:
    name: Unit tests (busted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install busted
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luarocks lua5.1 liblua5.1-dev
          sudo luarocks install busted

      - name: Run tests
        run: busted tests/ --verbose
