name: Package (dev build)

# Genera 2 zips instalables en WoW en cada push a dev o master.
# NO publica en CurseForge ni Wago — solo artefactos en GitHub Actions.
# Para descargar: Actions → run → Artifacts → craft-dev-<sha>

on:
  push:
    branches: [dev, master]

jobs:
  package:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ─── Assets ─────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache icon SVGs
        uses: actions/cache@v4
        with:
          path: .icon-cache
          key: lucide-icons-${{ hashFiles('docs/components/icons.md') }}

      - name: Install Python dependencies
        run: pip install Pillow cairosvg fonttools

      - name: Generate Lucide icon atlas
        run: python3 scripts/export-icons.py

      - name: Generate rounded-shape atlas (ADR-0018)
        run: python3 scripts/export-shapes.py

      - name: Cache Inter font
        id: cache-inter
        uses: actions/cache@v4
        with:
          path: Craft/media/Inter-*.ttf
          key: inter-font-v4.0

      - name: Download Inter font
        if: steps.cache-inter.outputs.cache-hit != 'true'
        run: |
          mkdir -p Craft/media /tmp/inter_extract
          curl -L -o /tmp/inter.zip \
            "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip"
          unzip -q /tmp/inter.zip -d /tmp/inter_extract
          find /tmp/inter_extract -name "Inter-Regular.ttf" | head -1 \
            | xargs -I{} cp {} Craft/media/Inter-Regular.ttf
          find /tmp/inter_extract -name "Inter-Medium.ttf" | head -1 \
            | xargs -I{} cp {} Craft/media/Inter-Medium.ttf
          find /tmp/inter_extract -name "Inter-Bold.ttf" | head -1 \
            | xargs -I{} cp {} Craft/media/Inter-Bold.ttf
          rm -rf /tmp/inter.zip /tmp/inter_extract

      - name: Cache Geist font
        id: cache-geist
        uses: actions/cache@v4
        with:
          path: Craft/media/Geist-*.ttf
          key: geist-font-v1

      - name: Download + instance Geist font (SIL OFL 1.1)
        if: steps.cache-geist.outputs.cache-hit != 'true'
        run: |
          mkdir -p Craft/media
          # Geist se distribuye como variable font → instanciar 3 pesos estáticos
          # (WoW no sintetiza pesos). Regular=400, Medium=500, Bold=700.
          curl -L -o /tmp/Geist-var.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/geist/Geist%5Bwght%5D.ttf"
          python3 -m fontTools.varLib.instancer /tmp/Geist-var.ttf wght=400 \
            -o Craft/media/Geist-Regular.ttf --update-name-table
          python3 -m fontTools.varLib.instancer /tmp/Geist-var.ttf wght=500 \
            -o Craft/media/Geist-Medium.ttf --update-name-table
          python3 -m fontTools.varLib.instancer /tmp/Geist-var.ttf wght=700 \
            -o Craft/media/Geist-Bold.ttf --update-name-table
          rm -f /tmp/Geist-var.ttf

      - name: Cache Geist Mono font
        id: cache-geist-mono
        uses: actions/cache@v4
        with:
          path: Craft/media/GeistMono-*.ttf
          key: geist-mono-font-v1

      - name: Download + instance Geist Mono font (SIL OFL 1.1) — fontMono, FR-106
        if: steps.cache-geist-mono.outputs.cache-hit != 'true'
        run: |
          mkdir -p Craft/media
          curl -L -o /tmp/GeistMono-var.ttf             "https://raw.githubusercontent.com/google/fonts/main/ofl/geistmono/GeistMono%5Bwght%5D.ttf"
          python3 -m fontTools.varLib.instancer /tmp/GeistMono-var.ttf wght=400             -o Craft/media/GeistMono-Regular.ttf --update-name-table
          rm -f /tmp/GeistMono-var.ttf

      - name: Verify assets
        run: |
          [ -f "Craft/media/lucide.tga"        ] || (echo "❌ lucide.tga"        && exit 1)
          [ -f "Craft/media/lucide-16.tga"     ] || (echo "❌ lucide-16.tga"     && exit 1)
          [ -f "Craft/media/lucide-32.tga"     ] || (echo "❌ lucide-32.tga"     && exit 1)
          [ -f "Craft/media/shape_pill_32x18.tga" ] || (echo "❌ shape_pill_32x18.tga" && exit 1)
          [ -f "Craft/media/shape_pill_24x14.tga" ] || (echo "❌ shape_pill_24x14.tga" && exit 1)
          [ -f "Craft/media/shape_circle.tga"     ] || (echo "❌ shape_circle.tga"     && exit 1)
          for n in 4 6 8 12 16; do
            [ -f "Craft/media/shape_ring_$n.tga" ] || (echo "❌ shape_ring_$n.tga" && exit 1)
          done
          [ -f "Craft/media/Inter-Regular.ttf" ] || (echo "❌ Inter-Regular.ttf" && exit 1)
          [ -f "Craft/media/Inter-Medium.ttf"  ] || (echo "❌ Inter-Medium.ttf"  && exit 1)
          [ -f "Craft/media/Inter-Bold.ttf"    ] || (echo "❌ Inter-Bold.ttf"    && exit 1)
          [ -f "Craft/media/Geist-Regular.ttf" ] || (echo "❌ Geist-Regular.ttf" && exit 1)
          [ -f "Craft/media/Geist-Medium.ttf"  ] || (echo "❌ Geist-Medium.ttf"  && exit 1)
          [ -f "Craft/media/Geist-Bold.ttf"    ] || (echo "❌ Geist-Bold.ttf"    && exit 1)
          [ -f "Craft/media/GeistMono-Regular.ttf" ] || (echo "❌ GeistMono-Regular.ttf" && exit 1)
          for fam in BettoSans BettoGeo; do
            for w in Regular Medium Bold; do
              [ -f "Craft/media/$fam-$w.ttf" ] || (echo "❌ $fam-$w.ttf (commiteada, no se descarga)" && exit 1)
            done
          done
          echo "✅ All assets present"

      # ─── Embeber Craft en Craft_Browser/libs/ ────────────────────────────
      - name: Embed Craft into Craft_Browser
        run: |
          mkdir -p Craft_Browser/libs/LibStub
          # LibStub directo a su lugar final — mismo nivel que Craft/
          curl -L -o Craft_Browser/libs/LibStub/LibStub.lua \
            "https://raw.githubusercontent.com/Ace3/LibStub/master/LibStub.lua"
          # Weave — vendoreada en Craft/libs/, se embebe al nivel de LibStub
          cp -r Craft/libs/Weave/ Craft_Browser/libs/Weave/
          # Craft — sin la carpeta libs/ interna
          cp -r Craft/ Craft_Browser/libs/Craft/
          rm -rf Craft_Browser/libs/Craft/libs/
          echo "✅ LibStub → Craft_Browser/libs/LibStub/LibStub.lua"
          echo "✅ Weave   → Craft_Browser/libs/Weave/"
          echo "✅ Craft   → Craft_Browser/libs/Craft/"

      # ─── Build zips ──────────────────────────────────────────────────────
      - name: Build zip files
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          mkdir -p dist

          # Craft.zip — para developers que quieran usar la librería
          zip -r "dist/Craft-${BRANCH}-${SHA}.zip" Craft/ \
            --exclude "*.git*" --exclude "*/__pycache__/*"

          # Craft_Browser.zip — addon showcase con Craft embebido
          zip -r "dist/CraftBrowser-${BRANCH}-${SHA}.zip" Craft_Browser/ \
            --exclude "*.git*" --exclude "*/__pycache__/*"

          echo "ZIP_NAME=craft-${BRANCH}-${SHA}" >> $GITHUB_ENV
          echo ""
          echo "📦 Artifacts:"
          ls -lh dist/

      # ─── Subir como artefactos de GitHub Actions ─────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/*.zip
          retention-days: 14
